<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 342" width="860" height="342" role="img" aria-label="agentrecall">
  <title>agentrecall</title>
  <defs><style>
      .bg{fill:#0d1117}.bar{fill:#161b22}
      .t{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px}
      .dim{fill:#7d8590}.fg{fill:#e6edf3}.cy{fill:#79c0ff}.gr{fill:#3fb950}
      .rd{fill:#f85149}.yl{fill:#d29922}.mg{fill:#d2a8ff}
  </style></defs>
  <rect class="bg" width="860" height="342" rx="10"/>
  <rect class="bar" width="860" height="30" rx="10"/>
  <rect class="bar" y="20" width="860" height="10"/>
  <circle cx="20" cy="15" r="5" fill="#ff5f57"/><circle cx="38" cy="15" r="5" fill="#febc2e"/><circle cx="56" cy="15" r="5" fill="#28c840"/>
  <text class="t dim" x="430" y="20" text-anchor="middle">agentrecall</text>
  <text class="t" x="20" y="60"><tspan class="gr">$</tspan> <tspan class="fg">pip install agentrecall-db</tspan></text>
  <text class="t dim" x="20" y="81">Successfully installed agentrecall-db-0.2.0     # that is the whole dependency tree</text>
  <text class="t" x="20" y="114"><tspan class="gr">$</tspan> <tspan class="fg">agentrecall --db agent.db add &quot;The user prefers dark mode&quot; --tag preference</tspan></text>
  <text class="t fg" x="20" y="135">#1  The user prefers dark mode</text>
  <text class="t" x="20" y="168"><tspan class="gr">$</tspan> <tspan class="fg">agentrecall --db agent.db add &quot;User is debugging the staging deploy&quot; --ttl 4h</tspan></text>
  <text class="t fg" x="20" y="189">#2  User is debugging the staging deploy  (expires 2026-08-19 15:28Z)</text>
  <text class="t" x="20" y="222"><tspan class="gr">$</tspan> <tspan class="fg">agentrecall --db agent.db search &quot;dark mode&quot;</tspan></text>
  <text class="t gr" x="20" y="243"> 0.017  #1    The user prefers dark mode</text>
  <text class="t" x="20" y="276"><tspan class="gr">$</tspan> <tspan class="fg">ls -l agent.db</tspan></text>
  <text class="t fg" x="20" y="297">-rw-------  1  40960  agent.db</text>
  <text class="t yl" x="20" y="318">One SQLite file. No vector database, no server, no API key.</text>
</svg>
